name: Sync reusable reference assets

on:
  push:
    paths:
      - '.github/workflows/sync-reference-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-hero-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sandesh site
        uses: actions/checkout@v4
      - name: Copy the exact Amogh desktop hero sequence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/hero-sequence-desktop
          base='https://raw.githubusercontent.com/Bhuvann27/Dr.amogh/main/assets/hero-sequence-desktop'
          for i in $(seq 1 197); do
            file=$(printf 'frame_%04d.webp' "$i")
            curl --fail --location --retry 3 --silent --show-error "$base/$file" -o "assets/hero-sequence-desktop/$file"
          done
      - name: Copy the exact Amogh mobile/high-resolution hero sequence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/hero-sequence-hires
          base='https://raw.githubusercontent.com/Bhuvann27/Dr.amogh/main/assets/hero-sequence-hires'
          for i in $(seq 1 197); do
            file=$(printf 'frame_%04d.webp' "$i")
            curl --fail --location --retry 3 --silent --show-error "$base/$file" -o "assets/hero-sequence-hires/$file"
          done
      - name: Copy generic ANISE assistant artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/chatbot
          curl --fail --location --retry 3 --silent --show-error 'https://raw.githubusercontent.com/Bhuvann27/Dr.amogh/main/assets/chatbot/anise-assistant.svg' -o assets/chatbot/anise-assistant.svg
          curl --fail --location --retry 3 --silent --show-error 'https://raw.githubusercontent.com/Bhuvann27/Dr.amogh/main/assets/chatbot/anise-assistant.webp' -o assets/chatbot/anise-assistant.webp
      - name: Commit copied assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/hero-sequence-desktop assets/hero-sequence-hires assets/chatbot
          if git diff --cached --quiet; then echo 'No asset changes to commit.'; exit 0; fi
          git commit -m 'Copy full Amogh hero sequence locally'
          git push
