<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Patient Story — Dr. Sandesh Mahesh</title><link rel="stylesheet" href="css/main.css"><style>.story-page{padding-top:120px}.conversation{max-width:820px;margin:50px auto}.bubble{padding:22px 24px;border:1px solid var(--line);border-radius:18px;margin:16px 0;background:#fff}.bubble.doctor{margin-right:16%;background:var(--stone)}.bubble.patient{margin-left:16%}.bubble small{display:block;color:var(--orange);font-weight:800;letter-spacing:.1em;margin-bottom:7px}.relate,.actions,.urgent{margin-top:60px;padding:30px;border:1px solid var(--line);border-radius:18px}.relate ul,.actions ol{padding-left:22px}.urgent{background:#fff2ed;border-color:#efc8bb}.demo-warning{margin:22px 0;padding:18px 20px;border:1px solid #e2c49c;border-radius:16px;background:#fff8ed;color:#5f4a2f}.demo-warning strong{display:block;margin-bottom:5px}.loading{color:var(--text-dim)}@media(max-width:650px){.bubble.doctor,.bubble.patient{margin-left:0;margin-right:0}}</style></head><body class="story-page"><nav class="site-nav"><a class="wordmark" href="stories.html">Patient Stories<span>.</span></a><a class="nav-cta" href="index.html#consult">Consult</a></nav><main><section class="section-pad"><div class="container"><a class="text-link" href="stories.html">← All stories</a><div id="storyRoot" class="conversation"><p class="loading">Loading story…</p></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="js/supabase-config.js"></script><script>const root=document.querySelector('#storyRoot');const params=new URLSearchParams(location.search);const id=params.get('id');const slug=params.get('slug')||params.get('story');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));if(!id&&!slug)root.innerHTML='<p>Story not found.</p>';else if(window.isSupabaseConfigured&&window.isSupabaseConfigured()){const sb=window.supabase.createClient(window.SUPABASE_CONFIG.url,window.SUPABASE_CONFIG.anonKey);let query=sb.from('patient_insights').select('*').eq('doctor_id',window.SUPABASE_CONFIG.doctorId).eq('status','published');query=id?query.eq('id',id):query.eq('slug',slug);query.single().then(({data:s,error})=>{if(error||!s){root.innerHTML='<p>Story not found.</p>';return}document.title=`${s.title} — Dr. Sandesh Mahesh`;root.innerHTML=`<span class="eyebrow">${esc(s.topic||'PATIENT STORY')}</span>${s.is_demo?'<div class="demo-warning"><strong>FICTIONAL DEMO STORY</strong><span>This is an imaginary example created only for the website preview. It is not a real patient experience or testimonial.</span></div>':''}<h1>${esc(s.title)}</h1><p style="color:var(--text-dim);font-size:1.05rem">${esc(s.subtitle||s.intro)}</p><div class="bubble"><small>ABOUT THIS STORY</small><div>${esc(s.intro)}</div></div>${(s.dialogue||[]).map(x=>`<div class="bubble doctor"><small>DR. SANDESH</small><div>${esc(x.q)}</div></div><div class="bubble patient"><small>PATIENT</small><div>${esc(x.a)}</div></div>`).join('')}<div class="relate"><h2>What may be worth noticing</h2><p>${esc(s.relate_intro)}</p><ul>${(s.relate_points||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p>${esc(s.relate_close)}</p></div><div class="actions"><h2>Practical things you can do</h2><ol>${(s.action_points||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div><div class="urgent"><strong>WHEN TO SEEK URGENT CARE</strong><p>${esc(s.urgent)}</p></div>`})}else root.innerHTML='<p>Stories will appear here once the private database is connected.</p>';</script></body></html>
